# SPDX-License-Identifier: GPL-3.0-only
# Files that belong to no package but may be in an Erik OS image.
# One regular expression per line, matched against the absolute path.
# Every entry needs a reason. Keep it narrow: a broad pattern can hide a leak.

# dpkg and apt state
^/var/lib/dpkg/                          # package database
^/var/lib/apt/                           # apt state (lists are emptied by live-build)
^/var/cache/apt/                         # apt caches (.deb files are checked separately)
^/var/cache/debconf/                     # debconf answers of the installed packages
^/var/lib/ucf/                           # conffile tracking
^/etc/alternatives/                      # update-alternatives links
^/var/lib/systemd/deb-systemd-                # systemd unit enable state written by maintainer scripts
^/etc/systemd/system/.*\.wants/          # units enabled by maintainer scripts
^/etc/systemd/system/[^/]+\.service$     # aliases created by deb-systemd-helper
^/etc/systemd/user/.*\.wants/            # user units enabled by maintainer scripts

# caches regenerated from package files
^/etc/ld\.so\.cache$                     # ldconfig
^/usr/share/mime/                        # update-mime-database
^/usr/share/icons/[^/]+/icon-theme\.cache$
^/usr/share/glib-2\.0/schemas/gschemas\.compiled$
^/usr/lib/x86_64-linux-gnu/gdk-pixbuf-2\.0/2\.10\.0/loaders\.cache$
^/usr/lib/x86_64-linux-gnu/gio/modules/giomodule\.cache$
^/usr/lib/x86_64-linux-gnu/gtk-[34]\.0/[^/]+/immodules\.cache$
^/usr/share/applications/mimeinfo\.cache$
^/var/cache/fontconfig/
^/var/cache/man/
^/var/cache/ldconfig/
^/usr/lib/locale/locale-archive$         # locale-gen, four Erik locales
^/var/lib/dbus/machine-id$               # emptied machine id link
^/etc/machine-id$                        # checked separately: must be empty
^/usr/lib/python3/dist-packages/.*\.pyc$ # byte-compiled by python3 maintainer scripts
^/usr/lib/python3\.[0-9]+/.*\.pyc$
^/usr/share/python3/.*\.pyc$

# configuration written by maintainer scripts
^/etc/(passwd|group|shadow|gshadow|subuid|subgid)-?$
^/etc/(hostname|hosts|timezone|localtime|mtab|resolv\.conf|fstab|adjtime)$
^/etc/default/(locale|keyboard|console-setup)$
^/etc/locale\.gen$
^/etc/console-setup/
^/etc/ssl/certs/                         # update-ca-certificates
^/etc/ca-certificates\.conf$
^/etc/dconf/db/[^/]+$                    # compiled dconf databases
^/etc/apt/sources\.list(\.d/.*)?$        # checked separately: only Debian and Erik sources
^/etc/apt/trusted\.gpg\.d/
^/etc/initramfs-tools/conf\.d/
^/boot/initrd\.img-                      # generated initramfs
^/etc/papersize$
^/etc/shells$
^/etc/environment$
^/etc/.*\.dpkg-(new|old|dist)$
^/var/lib/(polkit-1|gdm3|colord|sgml-base|xml-core|plymouth|pam|dhcp|NetworkManager|ucf|usb_modeswitch|swcatalog|fwupd|AccountsService|geoclue|upower|bluetooth|flatpak|PackageKit)/
^/var/log/                               # empty log files created by packages
^/etc/X11/                               # display manager defaults written at install
^/etc/fonts/conf\.d/
^/usr/share/fonts/.*/(fonts\.(dir|scale)|\.uuid)$
^/usr/share/info/dir$

# kernel, devices, runtime directories
^/(vmlinuz|initrd\.img)(\.old)?$         # links created by the kernel package
^/usr/lib/modules/[^/]+/modules\.[a-z.]+$  # depmod indexes
^/usr/lib/udev/hwdb\.bin$                # udevadm hwdb --update
^/dev/                                   # device nodes in the image
^/run/                                   # runtime directory placeholders
^/usr/local/man$                         # link created by base-files

# files base-files, netbase and systemd copy into /etc at install time
^/etc/(networks|inputrc|profile|nsswitch\.conf|modules|motd|issue|issue\.net|hosts\.(allow|deny)|host\.conf|locale\.conf|vconsole\.conf|debian_version|bash\.bashrc|skel/\.[a-z]+)$

# configuration generated by maintainer scripts (inspected 2026-10-01: no host data)
^/etc/rc[0-6S]\.d/[SK][0-9]{2}[a-z0-9.-]+$   # sysv-rc links for installed init scripts
^/etc/pam\.d/common-(account|auth|password|session|session-noninteractive)$  # pam-auth-update
^/etc/ssh/sshd_config$                   # openssh-server postinst, from its template
^/etc/network/interfaces$                # ifupdown postinst, only "source interfaces.d"
^/etc/initramfs-tools/modules$           # initramfs-tools template
^/etc/apparmor\.d/(local/[a-z_.-]+|tunables/[a-z-]+\.d/[a-z.]+)$  # empty local override files
^/etc/security/opasswd$                  # empty, created by libpam-modules
^/etc/udev/rules\.d/70-persistent-cd\.rules$  # empty, created during the build
^/etc/dpkg/origins/default$              # vendor link (still "debian", see ROADMAP)
^/etc/dictionaries-common/               # default dictionary links
^/var/spool/mail$                        # link to /var/mail
^/var/lib/shells\.state$                 # add-shell state
^/var/lib/systemd/catalog/database$      # journalctl --update-catalog
^/var/lib/wtmpdb/wtmp\.db$               # link to /var/log/wtmp.db
^/var/lib/emacsen-common/                # add-on registration state
^/root/\.(bashrc|profile)$               # copied from /etc/skel by base-files

# desktop edition: generated by maintainer scripts (inspected 2026-10-01: no host data)
^/usr/share/fonts/X11/[^/]+/(encodings\.dir|fonts\.alias)$  # xfonts-utils
^/var/lib/xfonts/
^/usr/share/gnome/applications/[a-z.-]+\.desktop$  # vim desktop file copy
^/usr/lib/x86_64-linux-gnu/gtk-4\.0/4\.0\.0/printbackends/giomodule\.cache$
^/usr/lib/cups/backend/(dnssd|mdns|snmp|socket|usb|lpd)$  # cups links to its backends
^/etc/cups/(cupsd\.conf|raw\.types|raw\.convs)$  # cups postinst, local only (Listen localhost)
^/etc/(crypttab|mailcap)$               # empty crypttab; update-mime
^/etc/xml/[a-z-]+\.xml(\.old)?$          # xml-core catalogs
^/etc/xml/catalog(\.old)?$
^/etc/sgml/catalog$
^/etc/lighttpd/conf-enabled/90-javascript-alias\.conf$  # javascript-common, inert without lighttpd
^/etc/ppp/(chap-secrets|pap-secrets|peers/provider)$    # ppp templates: only Debian example lines
^/etc/chatscripts/provider$
^/etc/opt/chrome/native-messaging-hosts/org\.gnome\.[a-z_]+\.json$  # links to gnome-browser-connector
^/etc/python3/debian_config$
^/etc/gdm3/greeter\.dconf-defaults$     # gdm3 postinst (logo comes from vendor-logos)
^/etc/libreoffice/registry/main\.xcd$
^/etc/systemd/user/dbus-org\.bluez\.obex\.service$
^/var/lib/app-info$
^/var/lib/man-db/auto-update$
^/var/lib/python/python3\.[0-9]+_installed$
^/var/lib/ghostscript/fonts/(cidfmap|Fontmap)$
^/var/cache/cracklib/                    # password strength dictionary, built from Debian words
^/var/cache/swcatalog/cache/[A-Za-z-]+\.xb$  # GNOME Software catalogue cache

# package files that are changed on purpose (checked by the integrity section)
modified ^/etc/calamares/settings\.conf$  # live only: hook 010 sets "branding: erik"; ROADMAP: own settings package

# dictionaries compiled by dictionaries-common
^/usr/lib/(ispell|aspell)/
^/var/lib/(ispell|aspell)/
^/var/cache/dictionaries-common/
^/var/lib/dictionaries-common/
^/usr/share/doc/debian-reference-common/docs/index\.html$  # generated language index

# live system (live-build, live-boot, live-config)
^/etc/live/
^/var/lib/live/
^/etc/apt/apt\.conf\.d/00(trustcdrom|recommends|cdrom)?$

# Erik live-only hook output (editions/desktop/config/hooks/live)
^/usr/lib/erik/erik-live-installer$
^/etc/xdg/autostart/erik-live-installer\.desktop$
